<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-3 media query</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 20px;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 2.4rem;
            font-weight: bold;
            letter-spacing: 0.3rem;
            background: #ff6b6b;
            transition: background 0.5s ease;
        }

        @media (max-width: 1200px) {
            .box {
                background: #4ecdc4;
                font-size: 2.1rem;
            }
        }

        @media (max-width: 900px) {
            .box {
                background: #5b8def;
                font-size: 1.8rem;
            }
        }

        @media (max-width: 600px) {
            .box {
                background: #f7b267;
                font-size: 1.4rem;
                letter-spacing: 0.15rem;
            }
        }
    </style>
</head>
<body>
    <div class="box">周雨欣</div>
</body>
</html>
