<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex{
            /*容器*/
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            width: 200px;
            height: 200px;
            border: 1px solid #ccc;
            background: #f8f9fa;
            gap: 6px;
            list-style: none;
            padding: 0;
        }
        .box{
            width: 40%;
            height: 40%;
            background: #ddd;
        } 
    </style>
</head>
<body>
    <h2>周雨欣 flex</h2>
    <ul class="flex">
        <li class="box"></li>
        <li class="box"></li>
        <li class="box"></li>
        <li class="box"></li>
    </ul>
</body>
</html>
