<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型、框模型，box-model</title>
    <style>
        #a{
            width: 400px;
            height: 400px;
            border: 1px solid #039;
            padding: 50px 40px 30px 20px;

        #b{
            width: 400px;
            height: 400px;
            border: 1px solid #039;
            padding: 50px 40px 30px 20px;
            margin: 40px auto;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
<div>
    <div id="a">523周雨欣</div>
    <div id="b">523周雨欣</div>

    <div id="d">523周雨欣</div>

</div>
