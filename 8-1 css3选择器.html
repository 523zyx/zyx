<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        main {
              /* 背景颜色#f2f3f4 */
            background-color: #f2f3f4;
            display: flex;
            flex-wrap: wrap;
            margin:10px;
        }
         .box{
            width: 150px;
            height: 150px;
            border: 1px solid #ccc;
            margin: 10px;
            background-color: white;
            font-size:40px;
            display: flex;
            /* 水平垂直居中 */
            align-items: center;
            justify-content: center;
            transition: all 0.6s;
            box-sizing: border-box;
            /* width包括了padding和border */
        }
        .box:first-child:hover{
            background-color: #000;
            color: #fff;
            font-size: 100px;
            border-width: 30px;
        }
        .box:nth-child(2):hover{
            box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.5);
        }
        .box:nth-child(3):hover{
            text-shadow: 100px 0px 20px rgba(0, 0, 0, 0.5);
        }
        .box:nth-of-type(4):hover{
            border-radius: 50%;
        }
        .box:nth-of-type(5){
            /* 线性渐变 */
            background: linear-gradient(45deg, red, yellow, blue);
        }
        .box:nth-of-type(6){
            /* 径向渐变 */
            background: radial-gradient(circle, red, yellow, blue);
        }
        /* 相邻兄弟选择器 */
        .box:nth-of-type(6)+ .box:hover{
            transform: scale(0.5);
        }
        .box:nth-of-type(8):hover{
            transform: translateX(100px);
           
        }
        .box:nth-of-type(9):hover{
            transform: rotateZ(180deg);
        }
        .box:nth-of-type(10):hover{
            transform: skewX(-45deg);
        }
        .box:nth-last-of-type(2):hover::before{
            content: "#";
            color: red;
        }
        /* 最后一个 */
        .box:last-child:hover::after{
            content: "周雨欣";
            color: red;
            font-size: 6px;
            display: block;
            width: 40px;
            height: 40px;
            margin: 10px;
            /* 扩展：黑底白字居中圆角的你的名字，有距离 */
            border-radius: 50%;
            text-align: center;
            line-height: 40px;
        }
        .box:nth-of-type(3n):hover{
           border: 3px solid red;
        }
        /* 扩展：鼠标在偶数个盒子上时有变化，变化效果自定义 */
        .box:nth-of-type(2n):hover{
            background-color: #000;
            color: #fff;
        }


    </style>
</head>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </div>
</body>
</html>
