<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-4 media query layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .title {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .box {
            flex: 1 1 20%;
            height: 120px;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
        }

        @media (max-width: 900px) {
            .box {
                flex-basis: 33.333%;
            }
        }

        @media (max-width: 700px) {
            .box {
                flex-basis: 50%;
            }
        }

        @media (max-width: 480px) {
            .box {
                flex-basis: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="title">周雨欣</div>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
    </div>
</body>
</html>
