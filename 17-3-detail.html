<!DOCTYPE html>
<!--
    作者：周雨欣
    建立时间：2026-11-02
    使用大模型：DeepSeek-V4.1-Flash
    功能名称：商品详情页（根据 URL 中的 id 用 fetch 请求单个商品）
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-3 商品详情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f7f3e8;
            font-family: "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            padding: 32px 20px 60px;
            color: #333;
        }
        .container {
            max-width: 940px;
            margin: 0 auto;
        }

        /* ---------- 顶部返回 ---------- */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            font-size: 13px;
            color: #8a4429;
            background: #fdfbf4;
            border: 1px solid #ece4d0;
            padding: 7px 16px;
            border-radius: 20px;
            transition: all .25s;
        }
        .back:hover {
            background: #d94f2b;
            border-color: #d94f2b;
            color: #fff;
        }
        .crumb {
            font-size: 12.5px;
            color: #a99372;
            font-family: Consolas, monospace;
        }
        .crumb b { color: #d94f2b; }

        /* ---------- 主体 ---------- */
        .panel {
            background: #fdfbf4;
            border: 1px solid #ece4d0;
            border-radius: 14px;
            padding: 24px;
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 28px;
            animation: fadeUp .45s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 820px) {
            .panel { grid-template-columns: 1fr; }
        }

        /* 图集 */
        .gallery .main {
            height: 340px;
            background: #f4efe1;
            border: 1px dashed #ddd2b8;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .gallery .main img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 14px;
        }
        .thumbs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .thumbs img {
            width: 58px;
            height: 58px;
            object-fit: contain;
            padding: 4px;
            background: #f4efe1;
            border: 2px solid #fdfbf4;
            border-radius: 8px;
            box-shadow: 0 0 0 1px #e2d8c2;
            cursor: pointer;
            transition: border-color .25s, transform .25s;
        }
        .thumbs img:hover { transform: translateY(-2px); }
        .thumbs img.on { border-color: #d94f2b; }

        /* 信息 */
        .head {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        h1 {
            font-size: 21px;
            line-height: 1.45;
            flex: 1;
            min-width: 200px;
        }
        .pill {
            display: inline-block;
            font-size: 11.5px;
            font-family: Consolas, monospace;
            padding: 3px 10px;
            border-radius: 20px;
            background: #f4efe1;
            color: #8a4429;
            border: 1px solid #e2d8c2;
            flex-shrink: 0;
        }
        .brandline {
            font-size: 12.5px;
            color: #a99372;
            margin-bottom: 14px;
        }
        .rate {
            font-size: 14px;
            color: #d9a23b;
            letter-spacing: 1px;
            margin-bottom: 14px;
        }
        .rate span {
            color: #84806f;
            font-size: 12.5px;
            font-family: Consolas, monospace;
            letter-spacing: 0;
            margin-left: 6px;
        }
        .priceline {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 14px 0;
            border-top: 1px dashed #ece4d0;
            border-bottom: 1px dashed #ece4d0;
            margin-bottom: 14px;
        }
        .priceline .now {
            font-family: Consolas, monospace;
            font-size: 25px;
            font-weight: bold;
            color: #d94f2b;
        }
        .priceline .old {
            font-family: Consolas, monospace;
            font-size: 13px;
            color: #b0a795;
            text-decoration: line-through;
        }
        .priceline .save {
            font-size: 12px;
            color: #557a2f;
            background: #f0f6e8;
            border: 1px solid #d8e6c6;
            padding: 3px 9px;
            border-radius: 20px;
        }
        .desc {
            font-size: 13px;
            color: #777;
            line-height: 1.85;
            margin-bottom: 16px;
        }
        .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }
        .tags span {
            font-size: 12px;
            font-family: Consolas, monospace;
            color: #6b6152;
            background: #f4efe1;
            border: 1px dashed #ddd2b8;
            padding: 4px 11px;
            border-radius: 20px;
        }
        .specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 16px;
            margin-bottom: 18px;
        }
        .spec {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 12.5px;
            color: #777;
            border-bottom: 1px dotted #eee6d3;
            padding-bottom: 6px;
        }
        .spec b {
            color: #555;
            font-weight: normal;
            font-family: Consolas, monospace;
            text-align: right;
        }
        .spec b.stock-ok { color: #557a2f; }
        .spec b.stock-low { color: #b93f1f; }

        /* 评价 */
        .reviews {
            border-top: 1px dashed #ece4d0;
            padding-top: 14px;
        }
        .reviews h2 {
            font-size: 14px;
            margin-bottom: 10px;
        }
        .review {
            background: #f4efe1;
            border-radius: 10px;
            padding: 10px 13px;
            margin-bottom: 8px;
        }
        .review .who {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #84806f;
            margin-bottom: 5px;
        }
        .review .who .st { color: #d9a23b; letter-spacing: .5px; }
        .review p {
            font-size: 12.5px;
            color: #6b6152;
            line-height: 1.7;
        }

        /* ---------- 骨架屏 ---------- */
        .sk .bar {
            background: linear-gradient(90deg, #f2ece0 25%, #faf7ee 37%, #f2ece0 63%);
            background-size: 400% 100%;
            animation: shimmer 1.3s ease infinite;
            border-radius: 8px;
        }
        .sk .pic { height: 340px; margin-bottom: 10px; }
        .sk .l { height: 14px; margin-bottom: 12px; }
        .sk .l.s { width: 40%; }
        .sk .l.m { width: 70%; }
        .sk .l.l { width: 92%; }
        @keyframes shimmer {
            0% { background-position: 100% 50%; }
            100% { background-position: 0 50%; }
        }

        /* ---------- 状态提示 ---------- */
        .state {
            text-align: center;
            padding: 70px 20px;
            background: #fdfbf4;
            border: 1px dashed #e2d8c2;
            border-radius: 14px;
            color: #a99372;
            font-size: 13.5px;
            line-height: 2;
        }
        .state .err {
            color: #b93f1f;
            font-family: Consolas, monospace;
            font-size: 12.5px;
        }
        .state a {
            color: #8a4429;
        }

        footer {
            text-align: center;
            font-size: 12px;
            color: #a99e88;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <a class="back" href="17-3.html">← 返回商品列表</a>
            <span class="crumb">正在请求 <b id="apiUrl">/products/…</b></span>
        </div>

        <div id="content"></div>

        <footer>详情页的 id 从 URL 里来（?id=1），再拼成接口地址去取数据。</footer>
    </div>

    <script>
        var content = document.getElementById("content");
        var apiUrlEl = document.getElementById("apiUrl");

        /* 从地址栏取 id，比如 17-3-detail.html?id=3 */
        function getId() {
            var params = new URLSearchParams(window.location.search);
            var id = parseInt(params.get("id"), 10);
            return isNaN(id) || id <= 0 ? 1 : id;
        }

        var id = getId();
        var API = "https://dummyjson.com/products/" + id;
        document.title = "17-3 商品详情 #" + id;

        function stars(rating) {
            var full = Math.round(rating);
            var s = "";
            for (var i = 1; i <= 5; i++) {
                s += i <= full ? "★" : "☆";
            }
            return s;
        }

        function oldPrice(price, discount) {
            return (price / (1 - discount / 100)).toFixed(2);
        }

        function showSkeleton() {
            content.innerHTML =
                '<div class="panel sk">' +
                    '<div>' +
                        '<div class="bar pic"></div>' +
                        '<div class="bar l s"></div>' +
                    '</div>' +
                    '<div>' +
                        '<div class="bar l m"></div>' +
                        '<div class="bar l l"></div>' +
                        '<div class="bar l l"></div>' +
                        '<div class="bar l m"></div>' +
                        '<div class="bar l l"></div>' +
                    '</div>' +
                '</div>';
        }

        function showError(err) {
            content.innerHTML =
                '<div class="state">' +
                    '加载失败 😢<br>' +
                    '<span class="err">' + err.name + ': ' + err.message + '</span><br>' +
                    '这个商品可能不存在，或者网络有问题<br>' +
                    '<a href="17-3.html">返回列表重新选择</a>' +
                '</div>';
        }

        /* ================= 渲染详情 ================= */
        function render(p) {
            var images = p.images && p.images.length ? p.images : [p.thumbnail];
            var save = (p.price * p.discountPercentage / 100).toFixed(2);
            var stockCls = p.stock > 10 ? "stock-ok" : "stock-low";

            var thumbHtml = "";
            images.forEach(function (src, i) {
                thumbHtml += '<img src="' + src + '" class="' + (i === 0 ? "on" : "") +
                    '" data-src="' + src + '" alt="商品图片 ' + (i + 1) + '">';
            });

            var specList = [
                ["分类", p.category],
                ["SKU", p.sku],
                ["重量", p.weight + " g"],
                ["尺寸", p.dimensions.width + " × " + p.dimensions.height + " × " + p.dimensions.depth],
                ["库存", p.stock + " 件"],
                ["最小起订", p.minimumOrderQuantity + " 件"],
                ["质保", p.warrantyInformation],
                ["配送", p.shippingInformation],
                ["退货", p.returnPolicy]
            ];

            var specHtml = "";
            specList.forEach(function (s) {
                var cls = s[0] === "库存" ? " " + stockCls : "";
                specHtml += '<div class="spec"><span>' + s[0] + '</span><b class="' +
                    cls.trim() + '">' + s[1] + '</b></div>';
            });

            var tagHtml = "";
            (p.tags || []).forEach(function (t) {
                tagHtml += "<span>" + t + "</span>";
            });

            var reviewHtml = "";
            (p.reviews || []).slice(0, 3).forEach(function (r) {
                reviewHtml +=
                    '<div class="review">' +
                        '<div class="who">' +
                            '<span>' + r.reviewerName + '</span>' +
                            '<span class="st">' + stars(r.rating) + '</span>' +
                        '</div>' +
                        '<p>' + r.comment + '</p>' +
                    '</div>';
            });

            content.innerHTML =
                '<div class="panel">' +
                    '<div class="gallery">' +
                        '<div class="main"><img id="mainImg" src="' + images[0] +
                            '" alt="' + p.title + '"></div>' +
                        '<div class="thumbs" id="thumbs">' + thumbHtml + '</div>' +
                    '</div>' +
                    '<div>' +
                        '<div class="head">' +
                            '<h1>' + p.title + '</h1>' +
                            '<span class="pill">#' + p.id + '</span>' +
                            '<span class="pill">' + p.availabilityStatus + '</span>' +
                        '</div>' +
                        '<div class="brandline">品牌：' + (p.brand || "无品牌") + '</div>' +
                        '<div class="rate">' + stars(p.rating) +
                            '<span>' + p.rating.toFixed(1) + ' / 5.0</span></div>' +
                        '<div class="priceline">' +
                            '<span class="now">$' + p.price.toFixed(2) + '</span>' +
                            '<span class="old">$' + oldPrice(p.price, p.discountPercentage) + '</span>' +
                            '<span class="save">立省 $' + save + '（-' +
                                Math.round(p.discountPercentage) + '%）</span>' +
                        '</div>' +
                        '<p class="desc">' + p.description + '</p>' +
                        '<div class="tags">' + tagHtml + '</div>' +
                        '<div class="specs">' + specHtml + '</div>' +
                        '<div class="reviews">' +
                            '<h2>用户评价（' + (p.reviews ? p.reviews.length : 0) + ' 条）</h2>' +
                            reviewHtml +
                        '</div>' +
                    '</div>' +
                '</div>';

            // 缩略图切换主图
            var mainImg = document.getElementById("mainImg");
            document.getElementById("thumbs").addEventListener("click", function (e) {
                var img = e.target.closest("img");
                if (!img) return;
                mainImg.src = img.getAttribute("data-src");
                var all = this.querySelectorAll("img");
                for (var i = 0; i < all.length; i++) all[i].classList.remove("on");
                img.classList.add("on");
            });
        }

        /* ================= 核心：按 id 请求详情 ================= */
        async function loadDetail() {
            apiUrlEl.textContent = "/products/" + id;
            showSkeleton();

            try {
                var res = await fetch(API);
                if (!res.ok) throw new Error("HTTP " + res.status);
                var data = await res.json();
                render(data);
            } catch (err) {
                showError(err);
            }
        }

        loadDetail();
    </script>
</body>
</html>
