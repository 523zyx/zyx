    <header class="nav">

            <nav class="nav-links" id="navLinks">

                <a href="works.html"><svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.2" y="4.6" width="17.6" height="14.8" rx="2.6"/><path d="M3.4 16.8 8.6 12l3.8 3.4" stroke="#4a90e2"/><circle cx="15.8" cy="9.2" r="1.5" fill="#4a90e2" stroke="none"/></svg>作品</a>

            <div class="nav-actions">
                <button id="themeToggle" aria-label="切换主题">🌗</button>
                <button id="burger" class="burger" aria-label="菜单">☰</button>
            </div>
        </div>
    </header>

    <main class="container section reveal">
        <div class="contact-wrap">
            <div>
                <p class="kicker">Contact</p>
                <h2>联系我</h2>
                <p>课程作业的讨论、页面上的问题，或者只是想聊聊前端，都可以直接留言。看到之后我会尽快回复。</p>
                <div class="facts">
                    <div class="fact"><span>GitHub</span><strong>github.com/523zyx</strong></div>
                    <div class="fact"><span>Email</span><strong>2673483874@qq.com</strong></div>
                    <div class="fact"><span>City</span><strong>在校 · 中国</strong></div>
                    <div class="fact"><span>Reply</span><strong>一般在 1～2 天内</strong></div>
                </div>
            </div>
            <form id="contactForm" class="contact-form" novalidate>
                <label>姓名<input type="text" id="name" required></label>
                <label>邮箱<input type="email" id="email" required></label>
                <label>留言<textarea id="message" rows="5" required></textarea></label>
                <button type="submit">提交</button>
            </form>
        </div>
    </main>

    <!-- 提示模态框 -->
    <div class="modal" id="contactModal" aria-hidden="true">
        <div class="modal-backdrop" id="contactBackdrop"></div>
        <div class="modal-content" role="dialog" aria-modal="true">
            <button class="modal-close" id="contactModalClose">✕</button>
            <div id="contactModalBody"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">© 2026 周雨欣</div>
